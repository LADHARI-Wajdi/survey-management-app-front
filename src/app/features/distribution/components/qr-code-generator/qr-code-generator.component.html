<div class="qr-code-container">
  <div class="qr-code-box">
    <div *ngIf="isLoading" class="loading-spinner">
      <div class="spinner"></div>
      <p>Generating QR Code...</p>
    </div>

    <div *ngIf="error" class="error-message">
      <i class="fas fa-exclamation-circle"></i>
      <p>{{ error }}</p>
      <button class="retry-button" (click)="generateQRCode()">
        Retry
      </button>
    </div>

    <div *ngIf="!isLoading && !error && qrCode" class="qr-code-content">
      <img [src]="qrCode.imageUrl" [alt]="'QR Code for distribution ' + distributionId" class="qr-code-image">
      <div class="qr-code-info">
        <p>Created: {{ qrCode.createdAt | date:'medium' }}</p>
        <p *ngIf="qrCode.expiresAt">Expires: {{ qrCode.expiresAt | date:'medium' }}</p>
        <p>Scans: {{ qrCode.scanCount }}</p>
      </div>
      <button class="download-button" (click)="downloadQRCode()">
        <i class="fas fa-download"></i>
        Download QR Code
      </button>
    </div>

    <div *ngIf="!isLoading && !error && !qrCode" class="no-qr-code">
      <i class="fas fa-qrcode"></i>
      <p>No QR code generated yet</p>
      <button class="generate-button" (click)="generateQRCode()">
        Generate QR Code
      </button>
    </div>
  </div>
</div>
