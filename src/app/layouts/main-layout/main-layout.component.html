<!-- layouts/main-layout/main-layout.component.html -->
<div class="main-layout" [ngClass]="{ 'menu-collapsed': isMenuCollapsed }">
  <!-- Use the shared admin navbar component -->
  <app-admin-navbar
    [currentUser]="currentUser"
    [pageTitle]="pageTitle"
    [isMenuCollapsed]="isMenuCollapsed"
    (menuToggle)="toggleMenu()"
    (logoutEvent)="logout()"
  ></app-admin-navbar>

  <!-- Main content area -->
  <div class="main-content">
    <main class="content">
      <!-- Loading indicator -->
      <app-loader></app-loader>

      <!-- Notifications container -->
      <app-notification></app-notification>

      <!-- Router outlet for content -->
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-content">
        <p>&copy; {{ currentYear }} SurveyApp - Tous droits réservés</p>
      </div>
    </footer>
  </div>
</div>
