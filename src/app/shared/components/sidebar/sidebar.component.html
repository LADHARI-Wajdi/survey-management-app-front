<aside class="sidebar" [ngClass]="{ 'collapsed': isCollapsed }">
  <div class="sidebar-header">
    <div class="logo">
      <img src="assets/images/logo.png" alt="Logo" />
      <span *ngIf="!isCollapsed">{{ appTitle }}</span>
    </div>
    <button class="toggle-btn" (click)="toggleCollapse.emit()">
      <i class="fa" [ngClass]="isCollapsed ? 'fa-angle-right' : 'fa-angle-left'"></i>
    </button>
  </div>

  <div class="sidebar-content">
    <nav class="main-nav">
      <ng-container *ngFor="let section of getMenuItemsBySection() | keyvalue">
        <div class="nav-section" *ngIf="!isCollapsed && section.key !== 'default'">
          {{ section.key }}
        </div>
        <ul>
          <li *ngFor="let item of section.value">
            <a 
              [routerLink]="item.isExternal ? null : item.path"
              [href]="item.isExternal ? item.path : null"
              [attr.target]="item.isExternal ? '_blank' : undefined"
              [ngClass]="{ 
                active: !item.isExternal && activeRoute.includes(item.path),
                'external-link': item.isExternal
              }"
              *ngIf="!item.roles || hasRole(item.roles[0])"
            >
              <i [class]="item.icon"></i>
              <span *ngIf="!isCollapsed">{{ item.label }}</span>
            </a>
          </li>
        </ul>
      </ng-container>
    </nav>
  </div>

  <div class="sidebar-footer" *ngIf="currentUser">
    <div class="user-menu">
      <div class="user-avatar">
        <div class="avatar-placeholder">
          {{ currentUser.firstName?.charAt(0) }}{{ currentUser.lastName?.charAt(0) }}
        </div>
      </div>
      <div class="user-details" *ngIf="!isCollapsed">
        <div class="user-name">{{ currentUser.firstName }} {{ currentUser.lastName }}</div>
        <div class="user-role">{{ getUserRoleDisplay() }}</div>
      </div>
    </div>
    <div class="footer-actions">
      <button class="btn-logout" (click)="logout.emit()">
        <i class="fa fa-sign-out-alt"></i>
        <span *ngIf="!isCollapsed">Déconnexion</span>
      </button>
    </div>
  </div>
</aside>
