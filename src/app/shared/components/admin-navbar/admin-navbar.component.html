<!-- Admin Navbar (Sidebar + Header) extracted from AdminLayoutComponent -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <img src="assets/images/logo.png" alt="Logo" />
      <span *ngIf="!isMenuCollapsed">SurveyApp Admin</span>
    </div>
  </div>
  <div class="sidebar-content">
    <nav class="main-nav">
      <ul>
        <li>
          <a routerLink="/admin/dashboard" [ngClass]="{active: activeRoute === '/admin/dashboard' || activeRoute === '/admin'}">
            <i class="fa fa-columns"></i>
            <span *ngIf="!isMenuCollapsed">Tableau de bord</span>
          </a>
        </li>
        <li>
          <a routerLink="/admin/users" [ngClass]="{active: activeRoute.includes('/admin/users')}">
            <i class="fa fa-users"></i>
            <span *ngIf="!isMenuCollapsed">Utilisateurs</span>
          </a>
        </li>
        <li>
          <a routerLink="/surveys" [ngClass]="{active: activeRoute.includes('/surveys')}">
            <i class="fa fa-list-alt"></i>
            <span *ngIf="!isMenuCollapsed">Enquêtes</span>
          </a>
        </li>

        <li>
          <a routerLink="/distribution" [ngClass]="{active: activeRoute.includes('/distribution')}">
            <i class="fa fa-share-alt"></i>
            <span *ngIf="!isMenuCollapsed">Distribution</span>
          </a>
        </li>
                <li>
          <a routerLink="/analytics" [ngClass]="{active: activeRoute.includes('/analytics')}">
            <i class="fa fa-tachometer"></i>
            <span *ngIf="!isMenuCollapsed">Statistiques globales</span>
          </a>
        </li>

      </ul>

    </nav>
  </div>
  <div class="sidebar-footer">
    <div class="user-menu" *ngIf="currentUser">
      <div class="user-avatar">
        <img *ngIf="currentUser.profilePicture" [src]="currentUser.profilePicture" alt="Profile" />
        <div *ngIf="!currentUser.profilePicture" class="avatar-placeholder">
          {{ currentUser.firstName?.charAt(0) }}{{ currentUser.lastName?.charAt(0) }}
        </div>
      </div>
      <div class="user-details" *ngIf="!isMenuCollapsed">
        <span class="user-name">{{ currentUser.firstName }} {{ currentUser.lastName }}</span>
        <span class="user-role">Administrateur</span>
      </div>
    </div>
    <div class="footer-actions" *ngIf="!isMenuCollapsed">
      <button class="btn-logout" (click)="logout()">
        <i class="fa fa-sign-out-alt"></i>
        Déconnexion
      </button>
    </div>
  </div>
</aside>
